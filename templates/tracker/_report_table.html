<div class="table-responsive">
  <table class="table table-hover mb-0 align-middle">
    <thead>
      <tr><th>ID</th><th>Title</th><th>Module</th><th>Priority</th><th>Status</th><th>Reported</th></tr>
    </thead>
    <tbody>
      {% for r in reports %}
      <tr>
        <td><a href="{% url 'report_detail' r.pk %}">{{ r.ref }}</a></td>
        <td>{{ r.title }}{% if r.duplicate_of %} <span class="badge bg-warning text-dark">possible duplicate</span>{% endif %}</td>
        <td>{{ r.module }}</td>
        <td><span class="badge bg-{{ r.priority_badge }}">{{ r.get_priority_display }}</span></td>
        <td><span class="badge bg-{{ r.status_badge }}">{{ r.get_status_display }}</span></td>
        <td>{{ r.created_at|date:"d M Y" }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="6" class="text-center text-muted py-4">No reports found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
