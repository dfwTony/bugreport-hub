{% extends "base.html" %}
{% block title %}New report | BugReport Hub{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-8">
  <h1 class="h3 mb-3">Submit a bug report</h1>
  <div class="card"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button class="btn btn-primary">Submit report</button>
      <a href="{% url 'report_list' %}" class="btn btn-link">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
